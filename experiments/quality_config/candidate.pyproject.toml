[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S", "T20", "DTZ", "C4", "SIM", "PIE", "ASYNC", "PT", "TRY", "LOG"]
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
disallow_any_explicit = true
enable_error_code = [
    "possibly-undefined",
    "explicit-override",
    "exhaustive-match",
    "redundant-expr",
    "ignore-without-code",
    "unused-awaitable",
]
