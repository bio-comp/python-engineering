[project]
name = "python-engineering-lab"
version = "0.1.0"
description = "Independent synthetic Python engineering experimental laboratory"
readme = "README.md"
requires-python = "==3.14.10"
dependencies = ["pydantic==2.14.1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_engineering"]

[dependency-groups]
citeprobe-lab = [
    "citeprobe",
]
dev = [
    "ruff>=0.12,<1",
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pytest-randomly>=3.16,<5",
    "hypothesis>=6,<7",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["python_engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["python_engineering"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.uv.sources]
citeprobe = { git = "https://github.com/Imanm02/citeprobe", rev = "c3842797ee99785a6b4d80884e0cd5d886487ddf" }
